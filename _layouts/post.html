---
layout: default
---
<div class="metadata">
    <h1>{{ page.title }}</h1>

    <p class="publication-date">{{ page.date | date_to_string }}</p>

    <div class="tags">
        {% for tag in page.tags %}
        {% assign tag_template = site.data.tags | where: "name", tag %}
        <p class="{{ tag_template[0].color }}">#{{ tag }}</p>
        {% endfor %}
    </div>
</div>

<div class="body">
    {{ content }}
</div>
