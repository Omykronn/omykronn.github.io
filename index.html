---
title: Home
layout: default
---
{% for post in site.posts %}
<article>
    <div class="metadata">
        <h1>{{ post.title }}</h1>

        <p class="publication-date">{{ post.date | date_to_string }}</p>

        <div class="tags">
            {% for tag in post.tags %}
            {% assign tag_template = site.data.tags | where: "name", tag %}
            <p class="{{ tag_template[0].color }}">#{{ tag }}</p>
            {% endfor %}
        </div>
    </div>

    {{ post.excerpt }}

    <p class="read-link">
        <a href="{{ post.url }}">&gt;&gt;&gt; Read</a>
    </p>
</article>
{% endfor %}
